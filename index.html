const KEY = "de_user_words";
const $ = id => document.getElementById(id);
const deDom = $("deWord"), cnDom = $("cnMean"), inputDe = $("inputDe"), inputCn = $("inputCn");
const synth = speechSynthesis;

const getUserWords = () => JSON.parse(localStorage.getItem(KEY) || "[]");
const saveUserWords = words => localStorage.setItem(KEY, JSON.stringify(words));

let wordsList = [...baseWordsList, ...getUserWords()];
let currentIndex = 0;

function loadWordData() {
  wordsList = [...baseWordsList, ...getUserWords()];
}

function renderWord() {
  if (!wordsList.length) {
    deDom.innerText = "词库为空";
    cnDom.innerText = "请添加单词";
    cnDom.style.display = "block";
    return;
  }
  cnDom.style.display = "none";
  deDom.innerText = wordsList[currentIndex][0];
  cnDom.innerText = wordsList[currentIndex][1];
}

function speakGerman(word) {
  synth.cancel();
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = "de-DE";
  utter.rate = 0.95;
  synth.speak(utter);
}

$("addWordBtn").onclick = () => {
  const de = inputDe.value.trim();
  const cn = inputCn.value.trim();
  if (!de || !cn) return alert("德语和中文释义都不能为空");

  const userWords = getUserWords();
  userWords.push([de, cn]);
  saveUserWords(userWords);
  loadWordData();

  inputDe.value = inputCn.value = "";
  alert(`成功添加单词：${de}`);
};

$("clearUserWords").onclick = () => {
  if (confirm("确定清空你网页上新增的全部单词？内置样例单词不受影响")) {
    localStorage.removeItem(KEY);
    loadWordData();
    currentIndex = 0;
    renderWord();
  }
};

$("speak").onclick = () => {
  if (wordsList.length) speakGerman(wordsList[currentIndex][0]);
};

$("show").onclick = () => cnDom.style.display = "block";

$("next").onclick = () => {
  if (!wordsList.length) return;
  currentIndex = (currentIndex + 1) % wordsList.length;
  renderWord();
};
